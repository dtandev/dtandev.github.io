experience:
  - role: Head of Science & Innovation
    org: TerraEye, Wrocław
    start: 2026-05-01
    summary: |
      Head the Science & Innovation department and sit on the company's leadership team. The
      department turns research into capabilities that can be priced and sold: machine
      learning and AI models and pipelines, multisensor Earth Observation methods and mineral
      prospectivity mapping. Own the R&D roadmap and the IP strategy, scientific quality and
      methodological sign-off before a capability is released, and the documentation of the
      ML pipelines. The team works in two modes: developing new capabilities, and supporting
      the delivery, product and engineering teams with ready methods and scientific advice,
      including moving research results into production. Develop the scientific team.
      R&D: EXPLOMAT, GRENMINE, RISPECT.
  - role: Geospatial Data Scientist
    org: TerraEye, Wrocław
    start: 2024-05-01
    end: 2026-04-30
    summary: |
      Developed and validated remote-sensing methodologies (Sentinel-1/2, Landsat, EMIT,
      thermal) for mineral exploration. Integrated multisensor data with ML and
      knowledge-based reasoning for prospectivity mapping and oversaw methodology rigour.
      R&D projects: EXPLOMAT (Sustainable Exploration Technologies for Raw Materials
      Discovery), GRENMINE (Gravitational Energy Storage in the post-Mine areas), RISPECT
      (Regional Innovation Scheme Project for Exploration Capabilities and Technologies).
  - role: R&D Team Leader
    org: Remote Sensing Environmental Solutions, Wrocław
    start: 2022-05-01
    end: 2024-04-30
    summary: |
      Led an R&D team developing satellite-based AI solutions for the mining and
      environmental sector. Managed or took part in NCBR-funded R&D projects (including
      HYPE4EXPLOR, ECOSAT and MINECAM), from methodology design to delivery. Directed the
      development of mineral-prospecting and mine-monitoring tools using EO data and
      machine learning.
  - role: Machine Learning Engineer
    org: Four Point, Wrocław
    start: 2021-08-01
    end: 2022-04-30
    summary: |
      Developed machine learning models for satellite-image analysis in the New Space
      sector; applied computer vision and deep learning to Earth Observation data.
  - role: Assistant Professor (also Adjunct Lecturer 2021–2022)
    org: University of Warmia and Mazury, Olsztyn
    start: 2016-10-01
    end: 2022-09-30
    summary: |
      R&D project on GPR-based detection and corrosion assessment of steel bars in
      reinforced concrete, as R&D team leader, funded by the National Science Centre.
      Projects funded by ESA: Geolocation Support for Outdoor Tourism Project and Global
      Yacht Positioning System. GPR surveys as team leader (planning, measurements,
      interpretation). Polish-Georgian Expedition, Kutaisi Archaeological Landscape,
      Georgia.
  - role: Geophysicist & GIS / Data Analyst
    org: GeoScience (owner) · Visimind Ltd · Environmental Expertise Rakus
    start: 2014-11-01
    end: 2021-12-31
    summary: |
      GPR acquisition and interpretation; geodetic and environmental GIS analysis. Data
      analysis at Visimind Ltd (October 2015 – February 2016).

