bio: |
  I'm Head of Science & Innovation at TerraEye, where I lead the team developing
  geospatial intelligence solutions for the mining industry across the whole project
  lifecycle — from exploration to reclamation. I have over 14 years of experience in
  geospatial data science, more than four of them focused specifically on Earth
  Observation, and my work sits where EO science meets industrial deployment.

  I've contributed to projects funded by the European Space Agency, the European
  Commission and Poland's National Centre for Research and Development, and worked on
  solutions later adopted by a major global resource group. My focus is integrating
  multisensor data and applying advanced geospatial analytics and machine learning to
  mineral exploration and geological interpretation.

